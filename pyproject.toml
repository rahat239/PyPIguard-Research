[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypiguard"
version = "1.2.0"
description = "Lightweight, explainable pre-install detection of malicious PyPI packages (static + AST features, Random Forest classifier)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Rahat Ahmed" }]
dependencies = [
    "requests>=2.20",
    "joblib>=1.0",
    "numpy>=1.20",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
web = ["flask>=2.0", "gunicorn"]

[project.scripts]
pypiguard = "pypiguard.cli:main"

[tool.setuptools.packages.find]
include = ["pypiguard*"]

[tool.setuptools.package-data]
pypiguard = ["data/*.joblib", "data/*.json"]
